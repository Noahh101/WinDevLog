name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Build executable
        run: build.bat
        shell: cmd

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          "build\Release\WinDeviceLog.exe"
          --verify-tag
          --title "Win Device Log $env:GITHUB_REF_NAME"
          --notes "Download WinDeviceLog.exe below to run Win Device Log on Windows. No local build is required."
        shell: pwsh
